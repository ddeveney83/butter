[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/butterlearn/app"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/butterlearn/app/*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/pricing"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/journal/what-does-elearning-cost"
  to = "/journal/how-to-brief-elearning-project"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
